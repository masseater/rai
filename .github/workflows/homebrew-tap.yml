name: homebrew-tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.1.34)"
        required: true
        type: string

permissions: {}

concurrency:
  group: homebrew-tap-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Checkout the Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: masseater/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true
          path: tap

      - name: Download the Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download "${TAG}" -R masseater/rai --pattern rai.rb --clobber -D tap/Formula

      - name: Normalize the formula with brew style
        run: |
          set -euo pipefail

          export PATH="/home/linuxbrew/.linuxbrew/bin:${PATH}"
          brew update
          # We avoid reformatting user-provided data such as the app description and homepage.
          brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc --fix tap/Formula/rai.rb || true

      - name: Drop the version line and add a smoke test unless present
        run: |
          set -euo pipefail

          formula=tap/Formula/rai.rb
          # The version is already in the download URLs; keeping a second copy
          # in the formula only makes the tap churn on every release.
          sed -i -e '/^  version "[^"]*"$/d' "${formula}"
          if ! grep -q 'test do' "${formula}"; then
            sed '$d' "${formula}" > "${formula}.tmp"
            printf '\n  test do\n    system bin/"rai", "--version"\n  end\n' >> "${formula}.tmp"
            printf 'end\n' >> "${formula}.tmp"
            mv "${formula}.tmp" "${formula}"
          fi

      - name: Commit and push the formula
        working-directory: tap
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rai.rb
          if git diff --cached --quiet; then
            echo "Formula is already up to date."
            exit 0
          fi
          git commit -m "rai ${TAG#v}"
          git push

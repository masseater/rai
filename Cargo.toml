[workspace]
resolver = "2"
members = [
    "crates/rai",
    "crates/rai-core",
    "crates/cmd/*",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masseater/rai"
authors = ["masseater"]

[workspace.dependencies]
# 内部crate
rai-core = { path = "crates/rai-core", version = "0.1.0" }
rai-cmd-hello = { path = "crates/cmd/rai-cmd-hello", version = "0.1.0" }

# 外部crate（共通バージョン）
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
